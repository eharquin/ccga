[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ccga"
version = "0.1.0"
description = "Conic Conformal Geometric Algebra (R^{5,3}) in kingdon"
requires-python = ">=3.10"
dependencies = ["kingdon==1.4.0", "sympy", "numpy"]

[tool.setuptools]
packages = ["ccga"]
